<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>DEMO</title>
<link rel="stylesheet" href="/web/theme.css">
<style>
  :root { --bg: var(--n-950); --bar: var(--n-950); --panel: var(--n-950); --line: var(--n-800); --text: var(--n-100); --muted: var(--n-500); --accent: var(--run); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
  .app { display: grid; grid-template-rows: 52px minmax(0, 1fr) 60px; height: 100vh; }

  /* top bar */
  .bar { display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--bar); border-bottom: 1px solid var(--hair); }
  .bar .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--n-800); border: 1px solid var(--hair-2); display: grid; place-items: center; font: 600 11px var(--mono); color: var(--n-300); }
  .bar .title { font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .sub { color: var(--muted); font: 11.5px var(--mono); white-space: nowrap; }
  .bar .timer { font: 500 13px var(--mono); color: var(--n-300); padding: 4px 9px; border-radius: 6px; background: var(--n-900); border: 1px solid var(--hair); }
  .bar .live { display: none; align-items: center; gap: 6px; color: var(--n-500); font: 500 11px var(--mono); letter-spacing: .06em; }
  .bar .live.on { display: flex; }
  .bar .live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--bad); }
  .bar .grow { flex: 1; }
  .bar a { color: var(--muted); text-decoration: none; font: 12px var(--mono); transition: color .15s; }
  .bar a:hover { color: var(--text); }
  .bar button { background: var(--n-100); color: var(--n-950); border: 0; border-radius: 8px; padding: 7px 14px; font: 600 13px var(--sans); cursor: pointer; transition: transform var(--spring-bouncy-ms) var(--spring-bouncy), opacity .2s; }
  .bar button:hover { transform: translateY(-1px); }
  .bar button:active { transform: scale(.96); transition-duration: .08s; }
  .bar button:disabled { opacity: .35; cursor: default; transform: none; }

  /* room */
  .room { display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; }
  .stage { display: grid; grid-template-rows: minmax(0, 1fr) minmax(120px, 28%); gap: 10px; padding: 10px; min-height: 0; transition: grid-template-rows var(--spring-default-ms) var(--spring-default); }
  body.work-busy .stage { grid-template-rows: minmax(0, 1fr) minmax(150px, 34%); }
  .grid { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 10px; min-height: 0; }
  .tile { position: relative; border-radius: 12px; overflow: hidden; background: radial-gradient(120% 90% at 50% 20%, var(--bg1, #3a3f4a), var(--bg2, #22252c)); min-height: 0;
    transition: box-shadow var(--spring-default-ms) var(--spring-default); }
  .tile::before { content: ""; position: absolute; inset: 0; background:
      radial-gradient(circle at 15% 30%, rgba(255,255,255,.06) 0 22px, transparent 23px),
      radial-gradient(circle at 82% 22%, rgba(255,255,255,.05) 0 30px, transparent 31px),
      linear-gradient(transparent 68%, rgba(0,0,0,.18) 68% 70%, transparent 70%); pointer-events: none; }
  .tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 3; box-shadow: inset 0 0 0 1px var(--hair); transition: box-shadow var(--spring-default-ms) var(--spring-default); }
  .tile.speaking { box-shadow: 0 0 26px rgba(59,130,246,.3); }
  .tile.speaking::after { box-shadow: inset 0 0 0 2px var(--run-ink); }
  .tile.egg.speaking { box-shadow: 0 0 30px rgba(245,200,76,.3); animation: glow 1s ease-in-out infinite alternate; }
  .tile.egg.speaking::after { box-shadow: inset 0 0 0 2px var(--egg); }
  @keyframes glow { to { box-shadow: 0 0 48px rgba(245,200,76,.5); } }
  .tile .art { position: absolute; inset: 10% 0 0 0; display: flex; justify-content: center; align-items: flex-end; }
  .tile .art svg { height: 100%; max-width: 100%; }
  .tile .name { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 6px; align-items: center; background: rgba(10,10,10,.66); backdrop-filter: blur(8px); border: 1px solid var(--hair); padding: 3px 9px 3px 7px; border-radius: 7px; font-size: 12.5px; font-weight: 600; max-width: calc(100% - 16px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .name .role { color: var(--n-400); font: 400 11px var(--mono); }
  .tile .name svg { width: 13px; height: 13px; flex: none; }
  .mic-on path { fill: var(--text); } .mic-off path { fill: var(--muted); }

  .tile.me video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); background: #111; }
  .tile.me .nocam { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font: 12px var(--mono); text-align: center; padding: 10px; }
  .tile.me .nocam b { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: var(--n-800); border: 1px solid var(--hair-2); color: var(--n-200); font: 600 24px var(--sans); margin: 0 auto 8px; }

  .tile.egg { grid-column: span 2; --bg1: #4b4329; --bg2: #26221a; }
  .tile.egg .art { inset: 4% 52% 13% 0; }
  .tile.egg .mind { position: absolute; left: 47%; right: 14px; top: 14px; bottom: 44px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 10px; }
  .mind .state { font-size: 13px; padding: 5px 12px; }
  .mind .state > span { display: inline-block; overflow: hidden; }
  .mind .state.idle { color: var(--n-400); }
  .mind .state.listening { color: var(--ok-ink); background: rgba(10,10,10,.55); }
  .mind .state.waiting { color: var(--ask); background: rgba(10,10,10,.55); }
  .mind .state.gap, .mind .state.floor { color: var(--n-950); background: var(--egg); border-color: transparent; box-shadow: 0 0 22px rgba(245,200,76,.35); }
  .mind .state.floor > i { animation: breathe .7s ease-in-out infinite; }
  .mind .detail { color: #e8e2cc; font-size: 13px; min-height: 2.8em; transition: opacity .2s; }

  .captions { position: absolute; left: 50%; bottom: 10px; translate: -50% 0; max-width: 78%; background: rgba(10,10,10,.78); backdrop-filter: blur(10px); border: 1px solid var(--hair); border-radius: 10px; padding: 8px 15px; font-size: 16px; line-height: 1.4; text-align: center; pointer-events: none; z-index: 5;
    opacity: 0; filter: blur(8px); scale: .96; transition: opacity .22s ease, filter .25s ease, scale var(--spring-bouncy-ms) var(--spring-bouncy); }
  .captions.on { opacity: 1; filter: blur(0); scale: 1; }
  .captions b { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--run-ink); margin-right: 8px; vertical-align: 1px; }
  .captions.egg b { color: var(--egg); }

  .work { display: grid; grid-template-rows: 34px minmax(0, 1fr); background: var(--n-950); border: 1px solid var(--hair); border-radius: 12px; overflow: hidden; min-height: 0; }
  body.work-busy .work { border-color: rgba(245,200,76,.35); }
  .work header { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--hair); font: 11.5px var(--mono); color: var(--muted); }
  .work header b { color: var(--egg); font-weight: 600; }
  .work header .node { margin-left: auto; padding: 1px 10px; font-size: 11px; opacity: 0; }
  .work header .node.on { opacity: 1; }
  .work-list { overflow-y: auto; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .work-list .empty { color: var(--muted); font: 12px var(--mono); padding: 6px 2px; }
  .job { border: 1px solid var(--hair); border-radius: 9px; padding: 8px 10px; background: var(--n-900); font-size: 13px; }
  .job .k { font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }
  .job p { margin: 0; color: var(--n-300); }
  .job.running { border-color: rgba(245,200,76,.35); }

  /* Egg Head panel */
  .panel { display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--panel); border-left: 1px solid var(--hair); min-height: 0; }
  .panel .head { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--hair); }
  .panel .head .mini { width: 34px; height: 34px; }
  .panel .head .mini svg { width: 100%; height: 100%; }
  .panel .head h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .panel .head .label { margin-left: auto; }
  .feed { overflow-y: auto; overflow-x: hidden; padding: 12px 12px 18px; display: flex; flex-direction: column; gap: 7px; }
  .feed > * { flex: none; }
  .feed .empty { color: var(--muted); font: 12px var(--mono); padding: 8px 2px; }
  .item { position: relative; border-radius: 9px; padding: 7px 10px; background: var(--n-900); border: 1px solid var(--hair); font-size: 12.8px; transform-origin: 50% 0; }
  .item .who { font-weight: 600; margin-right: 6px; }
  .item .txt { color: var(--n-300); }
  .chip { display: inline-block; border-radius: 5px; padding: 0 6px; font: 500 10.5px/1.6 var(--mono); text-transform: uppercase; letter-spacing: .05em; background: var(--n-800); color: var(--n-400); vertical-align: 1px; }
  .chip.bad { color: var(--bad-ink); background: var(--bad-soft); } .chip.good { color: var(--ok-ink); background: var(--ok-soft); }
  .chip.ask { color: var(--ask); background: var(--ask-soft); }
  .item.egg { background: var(--egg-soft); border-color: rgba(245,200,76,.35); }
  .item.egg .who { color: var(--egg); }
  .item.egg .txt { color: var(--egg-ink); }
  .item.egg.running { background: var(--egg-soft); border-color: rgba(245,200,76,.45); }
  .item.quiet { background: transparent; border: 1px dashed var(--n-800); color: var(--muted); font-size: 12px; }
  .item.quiet .who { color: var(--n-400); font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .07em; }

  /* controls */
  .controls { display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--bar); border-top: 1px solid var(--hair); position: relative; }
  .controls button { display: flex; flex-direction: column; align-items: center; gap: 3px; background: transparent; color: var(--n-400); border: 0; border-radius: 9px; padding: 6px 14px; font: 10.5px var(--mono); cursor: pointer; transition: background .15s, color .15s, transform var(--spring-bouncy-ms) var(--spring-bouncy); }
  .controls button:hover { background: var(--n-900); color: var(--text); }
  .controls button:active { transform: scale(.92); transition-duration: .08s; }
  .controls button svg { width: 19px; height: 19px; fill: var(--n-200); }
  .controls button.off svg { fill: var(--n-600); }
  .controls .leave { background: var(--bad); color: #fff; padding: 9px 18px; font: 600 13px var(--sans); flex-direction: row; }
  .controls .leave:hover { background: #dc2626; color: #fff; }

  /* toon animation */
  .toon .head { transform-box: fill-box; transform-origin: 50% 90%; }
  .toon.talking .head { animation: bob .36s ease-in-out infinite alternate; }
  .toon .eye { transform-box: fill-box; transform-origin: center; transition: transform .06s; }
  .toon.blink .eye { transform: scaleY(.08); }
  .toon.egg.thinking .glint { animation: glint 1.2s infinite; }
  .toon.egg.thinking .head { animation: think 2.4s ease-in-out infinite; }
  @keyframes bob { from { transform: translateY(0) rotate(-.6deg); } to { transform: translateY(-2.5px) rotate(.6deg); } }
  @keyframes think { 50% { transform: rotate(-3deg) translateY(-2px); } }
  @keyframes glint { 50% { opacity: .1; } }
  @media (prefers-reduced-motion: reduce) { .tile.egg.speaking { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="title" id="title">DEMO</div>
    <div class="timer"><span id="timer">00:00</span></div>
    <div class="live" id="live">live</div>
    <div class="grow"></div>
    <a href="/dashboard" target="_blank">Open dashboard ↗</a>
    <button id="start">Start call</button>
  </div>

  <div class="room">
    <section class="stage">
      <div class="grid" id="grid">
        <div class="captions" id="captions"></div>
      </div>
      <section class="work">
        <header>
          <b>Egg Head</b>
          <span class="node running" id="work-pill">looking</span>
        </header>
        <div class="work-list" id="work"><div class="empty">Waiting.</div></div>
      </section>
    </section>

    <aside class="panel">
      <div class="head">
        <div class="mini" id="mini"></div>
        <h2>Egg Head</h2>
      </div>
      <div class="feed" id="feed"><div class="empty">Egg Head's activity shows up here.</div></div>
    </aside>
  </div>

  <div class="controls">
    <button class="off" title="Muted"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2zM3.3 2.3 2 3.6l18.4 18.4 1.3-1.3z"/></svg>Mic</button>
    <button id="cam-btn" title="Camera"><svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>Camera</button>
    <button title="Share"><svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h6v2H8v2h8v-2h-2v-2h6a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 12H4V6h16zM12 7l-4 4h3v4h2v-4h3z"/></svg>Share</button>
    <button title="React"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-3.5 7a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm7 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM12 18a5.5 5.5 0 0 1-5-3.2h10A5.5 5.5 0 0 1 12 18z"/></svg>React</button>
    <button title="Raise"><svg viewBox="0 0 24 24"><path d="M18 8.5V6a1.5 1.5 0 0 0-3 0V4.5a1.5 1.5 0 0 0-3 0V4a1.5 1.5 0 0 0-3 0v1a1.5 1.5 0 0 0-3 0v8.6L4.7 12a1.6 1.6 0 0 0-2.3 2.2l4.8 5.4A6 6 0 0 0 11.7 22H14a6 6 0 0 0 6-6V8.5a1 1 0 0 0-2 0z"/></svg>Raise</button>
    <button class="leave" title="Leave">Leave</button>
  </div>
</div>

<script type="module" src="/web/meeting.js"></script>
</body>
</html>
