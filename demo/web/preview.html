<!doctype html>
<html><head><meta charset="utf-8"><title>Egg Head avatars</title>
<style>
  body { margin: 0; background: #fdf8f1; font-family: system-ui, sans-serif; color: #5a4a44 }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center }
  .card { background: #fff; border-radius: 18px; width: 136px; padding: 10px 10px 8px; text-align: center; box-shadow: 0 2px 10px #0000000d; transition: box-shadow .2s }
  .card.talking { box-shadow: 0 0 0 3px #f0b3a8 }
  .card svg { width: 130px; height: 150px; display: block; margin: 0 auto }
  .egg .card svg { width: 200px; height: 200px }
  .egg .card { width: 220px }
  .name { font-size: 14px; font-weight: 600 } .role { font-size: 12px; opacity: .6 }
  button { font: inherit; padding: 8px 16px; border-radius: 999px; border: 0; background: #f0b3a8; color: #fff; cursor: pointer; margin: 4px }
  .bar { text-align: center; margin: 14px 0 }
</style></head>
<body><div class="wrap">
  <div class="row egg" id="eggs"></div>
  <div class="bar">
    <button id="play">Play test conversation</button>
    <button id="cycle">Cycle egg states</button>
    <label><input type="file" id="file" accept="audio/*"> test with real audio (egg)</label>
  </div>
  <div class="row" id="people"></div>
</div>
<script type="module">
import { drawEggHead } from "./egg.js"
import { drawPerson, PEOPLE } from "./person.js"
const card = (parent, toon, name, role) => {
  const c = document.createElement("div"); c.className = "card"
  c.append(toon.svg); c.insertAdjacentHTML("beforeend", `<div class="name">${name}</div><div class="role">${role}</div>`)
  parent.append(c); return c
}
const states = ["neutral", "listening", "speaking", "unsure"]
const eggs = states.map((s) => { const e = drawEggHead({ state: s }); card(document.getElementById("eggs"), e, "Egg Head", s); return e })
const names = [...Object.keys(PEOPLE), "Alex"]
const people = names.map((n, i) => { const p = drawPerson(n, i); p.card = card(document.getElementById("people"), p, n, p.person.role || "Guest"); return p })
// keep the "speaking" sample egg talking forever with a text rhythm
const loop = () => { eggs[2].say(null, 3.2, { text: "The database is down, not fine. I checked." }); setTimeout(loop, 3600) }
loop()
const lines = [[0, "Okay team, what's the status on the database?"], [2, "Database is fine, latency looks normal."], [5, "Hmm, are we sure about that?"]]
document.getElementById("play").onclick = async () => {
  for (const [i, text] of lines) {
    const p = people[i], d = text.length / 13
    p.card.classList.add("talking"); p.say(null, d, { text })
    await new Promise((r) => setTimeout(r, d * 1000 + 400)); p.card.classList.remove("talking")
  }
  eggs[0].say(null, 2.6, { text: "Quick check: the database is down." })
}
let k = 0
document.getElementById("cycle").onclick = () => eggs[0].setState(states[++k % 4])
document.getElementById("file").onchange = (ev) => {
  const a = new Audio(URL.createObjectURL(ev.target.files[0]))
  a.onloadedmetadata = () => { a.play(); eggs[0].say(null, a.duration, { audio: a }) }
}
window.__eggs = eggs; window.__people = people
</script></body></html>
