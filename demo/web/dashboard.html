<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>DEMO</title>
<link rel="stylesheet" href="/web/theme.css">
<style>
  :root { --bg: var(--n-950); --panel: var(--n-950); --line: var(--n-800); --text: var(--n-100); --muted: var(--n-500); --agent: var(--run-ink); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 22px; border-bottom: 1px solid var(--hair); position: sticky; top: 0; background: rgba(10,10,10,.82); backdrop-filter: blur(10px); z-index: 3; }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  header h1 span { color: var(--egg); }
  header .sub { color: var(--muted); font: 12px var(--mono); }
  header .grow { flex: 1; }
  header a { color: var(--muted); font: 12px var(--mono); text-decoration: none; transition: color .15s; }
  header a:hover { color: var(--text); }
  header button { background: var(--n-100); color: var(--n-950); border: 0; border-radius: 8px; padding: 7px 14px; font: 600 13px var(--sans); cursor: pointer; transition: transform var(--spring-bouncy-ms) var(--spring-bouncy), opacity .2s; }
  header button:hover { transform: translateY(-1px); }
  header button:active { transform: scale(.96); transition-duration: .08s; }
  header button:disabled { opacity: .35; cursor: default; transform: none; }
  .live { display: none; align-items: center; gap: 6px; color: var(--n-500); font: 500 11px var(--mono); letter-spacing: .06em; }
  .live.on { display: inline-flex; }
  .live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--bad); }

  main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(260px, 0.8fr); gap: 20px; padding: 16px 22px 40px; align-items: start; }
  section { background: var(--n-950); border: 1px solid var(--hair); border-radius: 14px; padding: 14px 16px; min-width: 0; }
  h2 { margin: 0 0 10px; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); display: flex; justify-content: space-between; }
  .empty { color: var(--n-600); font: 12px var(--mono); }
  #moment-sec { position: sticky; top: 64px; }

  /* transcript: a time spine, not a stack of cards */
  #transcript { max-height: 72vh; overflow-y: auto; margin: 0 -4px; padding: 0; }
  .t-line { position: relative; display: grid; grid-template-columns: 44px 14px 1fr; gap: 0 8px; padding: 8px 12px 8px 4px; transform-origin: 50% 0; }
  .t-time { color: var(--n-600); font: 12px var(--mono); text-align: right; padding-top: 2px; }
  .t-rail { position: relative; }
  .t-rail::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--n-800); transform: translateX(-50%); }
  .t-line:first-child .t-rail::before { top: 14px; }
  .t-line:last-child .t-rail::before { bottom: auto; height: 14px; }
  .t-rail i { position: absolute; z-index: 1; left: 50%; top: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--n-700); transform: translateX(-50%); }
  .t-who { font-weight: 600; margin-right: 6px; }
  .t-who i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
  .t-text { color: var(--n-300); }
  .t-text.cut::after { content: " cut off"; color: var(--bad-ink); font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .06em; margin-left: 4px; }
  .trig { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; align-items: center; }
  .tag { display: inline-block; border-radius: 5px; padding: 1px 7px; font: 11.5px var(--mono); background: var(--n-800); color: var(--n-400); white-space: nowrap; }
  .tag.bad { color: var(--bad-ink); background: var(--bad-soft); } .tag.good { color: var(--ok-ink); background: var(--ok-soft); }
  .tag.ask { color: var(--ask); background: var(--ask-soft); }
  .sub-row { position: relative; margin: 7px 0 0; padding: 6px 10px; border-radius: 8px; font-size: 13px; }
  .sub-row.egg { background: var(--egg-soft); border: 1px solid rgba(245,200,76,.35); color: var(--egg-ink); }
  .sub-row.egg b { color: var(--egg); }
  .sub-row.agent { background: var(--run-soft); border: 1px solid rgba(59,130,246,.35); color: var(--n-200); }
  .sub-row.agent b { color: var(--agent); }
  .sub-row.quiet { border: 1px dashed var(--n-800); color: var(--muted); }
  .sub-row.quiet b { color: var(--n-400); font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .07em; margin-right: 4px; }

  .state { position: relative; display: inline-flex; align-items: center; gap: 6px; overflow: hidden; font: 500 11px/1.5 var(--mono); padding: 1px 8px; border-radius: 999px; white-space: nowrap;
    border: 1px solid transparent; transition: background-color .12s, color .12s; }
  .state.raised, .state.barged, .state.answered { color: var(--n-950); background: var(--egg); }
  .state.corrected, .state.true, .state.overruled, .state.parked, .state.dropped, .state.done { color: var(--ok-ink); background: var(--ok-soft); border-color: rgba(34,197,94,.25); }
  .state.contradicted, .state.confirmed, .state.failed { color: var(--bad-ink); background: var(--bad-soft); border-color: rgba(239,68,68,.3); }
  .state.listening, .state.ready { color: var(--ask); background: var(--ask-soft); border-color: rgba(129,140,248,.3); }
  .fact { padding: 12px 0; border-bottom: 1px solid var(--hair); }
  .fact:last-child { border-bottom: 0; padding-bottom: 2px; }
  .fact .k { font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }
  .fact p { margin: 0 0 6px; color: var(--n-300); }
  .fact p:last-child { margin-bottom: 0; }
  .fact b { color: var(--n-100); }
  .fact .dim { color: var(--muted); font: 12px var(--mono); }
  /* decision tree */
  .tree-wrap { margin: 16px 22px 0; }
  .tree-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .tree-head h2 { margin: 0; }
  .choice { display: inline-block; border: 1px solid var(--hair); border-radius: 6px; padding: 2px 8px; font: 11.5px var(--mono); color: var(--n-300); margin: 0 5px 5px 0; }
  .layers { margin: 8px 0 0; padding: 0 0 0 16px; color: var(--n-400); font: 12px var(--mono); }
  .tree-scroll { overflow-x: auto; padding-bottom: 4px; }
  .tree { position: relative; margin: 0 auto; }
  .tree svg { position: absolute; inset: 0; overflow: visible; }
  .tree path { fill: none; stroke: var(--n-800); stroke-width: 1.5px; stroke-dasharray: 1; stroke-dashoffset: 0; transition: stroke .2s, stroke-width var(--spring-default-ms) var(--spring-default); }
  .tree path.asked { stroke: var(--n-700); stroke-dasharray: .012 .012; }
  .tree path.no { stroke: var(--n-400); stroke-width: 2px; stroke-dasharray: .06 .045; }
  .tree text.fork-no { fill: var(--n-500); font: 600 10px var(--mono); text-anchor: middle; pointer-events: none; }
  .tree path.hit { stroke: var(--n-600); }
  .tree path.on { stroke: var(--n-300); stroke-width: 2px; }
  .tree path.on.run, .tree path.on.wait { stroke: var(--run); }
  .tree path.on.quiet { stroke: #22c55e; }
  .tree path.on.speak { stroke: var(--egg); stroke-width: 2.5px; filter: drop-shadow(0 0 4px rgba(245,200,76,.6)); }
  .tree path.on.skip { stroke-dasharray: .012 .012; }
  .tn { position: absolute; overflow: hidden; display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 0 10px; border-radius: 10px; cursor: pointer;
    background: var(--n-900); border: 1px solid var(--hair); color: var(--n-500);
    transition: background-color .12s, color .12s, border-color .2s, opacity .25s, box-shadow var(--spring-default-ms) var(--spring-default); }
  .tn:hover { border-color: var(--hair-2); }
  .tn .tl { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .tn .tl span { overflow: hidden; text-overflow: ellipsis; }
  .tn .count { margin-left: auto; font: 600 11px var(--mono); color: var(--n-300); }
  .tn .tm { display: flex; align-items: center; gap: 6px; font: 10.5px var(--mono); color: var(--n-500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tn.leaf .tl::before { content: ""; width: 6px; height: 6px; border-radius: 50%; flex: none; background: #22c55e; opacity: .6; }
  .tn.speak-leaf .tl::before { background: var(--egg); }
  .tn.off { opacity: .32; }
  .tn.hit { color: var(--n-200); border-color: var(--hair-2); }
  .tn.no { opacity: .62; border-style: dashed; }
  .tn.yes { background: var(--n-800); border-color: var(--hair-2); color: var(--n-100); }
  .tn.yes .tm, .tn.wait .tm { color: var(--n-400); }
  .tn.wait { color: var(--n-100); border-color: rgba(59,130,246,.6); box-shadow: 0 0 18px rgba(59,130,246,.18); }
  .tn.wait::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(147,197,253,.9); animation: breathe 1.5s ease-in-out infinite; pointer-events: none; }
  .tn.running .tm { color: #dbeafe; }
  .tn.skip { border-style: dashed; color: var(--n-400); }
  .tn.quiet { background: var(--ok-soft); border-color: rgba(34,197,94,.45); color: var(--ok-ink); }
  .tn.quiet .tm { color: #bbf7d0; opacity: .8; }
  .tn.speak { background: var(--egg); border-color: transparent; color: var(--n-950); box-shadow: 0 0 24px rgba(245,200,76,.35); }
  .tn.speak .tm { color: #3f3000; }
  .tn.speak.leaf .tl::before { background: var(--n-950); opacity: 1; }
  .tn.focus { box-shadow: 0 0 0 2px var(--n-100); }
  .bar { position: relative; flex: none; width: 44px; height: 4px; border-radius: 2px; background: var(--n-700); }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--n-500); }
  .bar.pass i { background: var(--run); }
  .tn.yes .bar.pass i { background: var(--run-ink); }
  .bar u { position: absolute; top: -2px; bottom: -2px; width: 1.5px; background: var(--n-200); }
  .reasons { display: inline-flex; gap: 3px; }
  .reasons b { width: 9px; height: 9px; border-radius: 3px; }
  .reasons b.ok { background: #22c55e; } .reasons b.bad { background: var(--bad); }
  .t-line { cursor: pointer; transition: background-color .15s, opacity .25s; }
  .t-line:hover { background: rgba(255,255,255,.025); }
  .t-line.sel { background: rgba(59, 130, 246, .07); }
  .t-line.sel .t-time { color: var(--run-ink); }
  .t-line.sel .t-rail i { background: var(--run); width: 8px; height: 8px; box-shadow: 0 0 0 3px rgba(59, 130, 246, .28); }
  .t-line.dim { opacity: .3; }
  .t-line.hit .t-rail i { background: var(--n-300); }

  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } #moment-sec { position: static; } }
</style>
</head>
<body>
<header>
  <span class="live" id="live">live</span>
  <div class="grow"></div>
  <a href="/">Meeting ↗</a>
  <button id="start">Start call</button>
</header>

<section class="tree-wrap">
  <div class="tree-scroll"><div class="tree" id="tree"></div></div>
</section>

<main>
  <section>
    <h2>Transcript</h2>
    <div id="transcript"><div class="empty">The call shows up here once it starts.</div></div>
  </section>
  <section id="moment-sec">
    <h2 id="moment-h">On this line</h2>
    <div id="moment"><div class="empty">Pick a line in the transcript.</div></div>
  </section>
</main>
<script type="module" src="/web/dashboard.js"></script>
</body>
</html>
