<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Egg Head · run dashboard</title>
<link rel="stylesheet" href="/web/kit.css">
<style>
  :root { --bg: var(--n-950); --panel: var(--n-950); --line: var(--n-800); --text: var(--n-100); --muted: var(--n-500); --agent: var(--run-ink); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 22px; border-bottom: 1px solid var(--hair); position: sticky; top: 0; background: rgba(10,10,10,.82); backdrop-filter: blur(10px); z-index: 3; }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  header h1 span { color: var(--egg); }
  header .sub { color: var(--muted); font: 12px var(--mono); }
  header .grow { flex: 1; }
  header a { color: var(--muted); font: 12px var(--mono); text-decoration: none; transition: color .15s; }
  header a:hover { color: var(--text); }
  header button { background: var(--n-100); color: var(--n-950); border: 0; border-radius: 8px; padding: 7px 14px; font: 600 13px var(--sans); cursor: pointer; transition: transform var(--spring-bouncy-ms) var(--spring-bouncy), opacity .2s; }
  header button:hover { transform: translateY(-1px); }
  header button:active { transform: scale(.96); transition-duration: .08s; }
  header button:disabled { opacity: .35; cursor: default; transform: none; }
  .live { display: none; align-items: center; gap: 7px; color: var(--bad-ink); font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .09em; }
  .live.on { display: inline-flex; }
  .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); animation: ring 1.6s ease-out infinite; }
  @keyframes ring { from { box-shadow: 0 0 0 0 rgba(239,68,68,.6); } to { box-shadow: 0 0 0 7px rgba(239,68,68,0); } }

  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; padding: 18px 22px 0; }
  .kpi { position: relative; overflow: hidden; background: var(--n-900); border: 1px solid var(--hair); border-radius: 12px; padding: 12px 14px; }
  .kpi b { display: flex; width: fit-content; font: 600 26px/1.1 var(--mono); letter-spacing: -.02em; margin-bottom: 6px; }
  .kpi > span { font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .kpi.bad b { color: var(--bad-ink); } .kpi.egg b { color: var(--egg); } .kpi.agent b { color: var(--agent); } .kpi.quiet b { color: var(--n-300); }

  main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; padding: 16px 22px 40px; }
  section { background: var(--n-950); border: 1px solid var(--hair); border-radius: 14px; padding: 14px 16px; min-width: 0; }
  h2 { margin: 0 0 10px; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); display: flex; justify-content: space-between; }
  .right { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .empty { color: var(--n-600); font: 12px var(--mono); }

  /* transcript */
  .t-line { position: relative; display: grid; grid-template-columns: 48px 1fr; gap: 10px; padding: 9px 6px; border-bottom: 1px solid var(--hair); border-radius: 8px; transform-origin: 50% 0; }
  .t-line:last-child { border-bottom-color: transparent; }
  .t-time { color: var(--n-600); font: 12px var(--mono); padding-top: 2px; }
  .t-who { font-weight: 600; margin-right: 6px; }
  .t-who i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
  .t-text { color: var(--n-300); }
  .t-text.cut::after { content: " cut off"; color: var(--bad-ink); font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .06em; margin-left: 4px; }
  .trig { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; align-items: center; }
  .tag { display: inline-block; border-radius: 5px; padding: 1px 7px; font: 11.5px var(--mono); background: var(--n-800); color: var(--n-400); white-space: nowrap; }
  .tag.bad { color: var(--bad-ink); background: var(--bad-soft); } .tag.good { color: var(--ok-ink); background: var(--ok-soft); }
  .tag.ask { color: var(--ask); background: var(--ask-soft); }
  .sub-row { position: relative; margin: 7px 0 0; padding: 6px 10px; border-radius: 8px; font-size: 13px; }
  .sub-row.egg { background: var(--egg-soft); border: 1px solid rgba(245,200,76,.35); color: var(--egg-ink); }
  .sub-row.egg b { color: var(--egg); }
  .sub-row.agent { background: var(--run-soft); border: 1px solid rgba(59,130,246,.35); color: var(--n-200); }
  .sub-row.agent b { color: var(--agent); }
  .sub-row.quiet { border: 1px dashed var(--n-800); color: var(--muted); }
  .sub-row.quiet b { color: var(--n-400); font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .07em; margin-right: 4px; }

  /* tables */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--n-600); font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .08em; padding: 4px 6px 7px; border-bottom: 1px solid var(--hair); }
  td { padding: 8px 6px; border-bottom: 1px solid var(--hair); vertical-align: top; color: var(--n-300); }
  td b { color: var(--n-100); font-weight: 600; }
  tr:last-child td { border-bottom-color: transparent; }
  tr { position: relative; }
  td .dim { color: var(--muted); font: 11.5px var(--mono); display: block; margin-top: 2px; }
  td.n { white-space: nowrap; font: 12px var(--mono); }
  .state { position: relative; display: inline-flex; align-items: center; gap: 6px; overflow: hidden; font: 500 11px/1.5 var(--mono); padding: 1px 8px; border-radius: 999px; white-space: nowrap;
    border: 1px solid transparent; transition: background-color .12s, color .12s; }
  .state.raised, .state.barged, .state.answered { color: var(--n-950); background: var(--egg); }
  .state.corrected, .state.true, .state.overruled, .state.parked, .state.dropped, .state.done { color: var(--ok-ink); background: var(--ok-soft); border-color: rgba(34,197,94,.25); }
  .state.contradicted, .state.confirmed, .state.failed { color: var(--bad-ink); background: var(--bad-soft); border-color: rgba(239,68,68,.3); }
  .state.listening, .state.ready { color: var(--ask); background: var(--ask-soft); border-color: rgba(129,140,248,.3); }
  .quiet-list div { padding: 8px 0; border-bottom: 1px solid var(--hair); font-size: 13px; color: var(--n-300); }
  .quiet-list div:last-child { border-bottom-color: transparent; }
  .quiet-list span { color: var(--n-600); font: 12px var(--mono); margin-right: 8px; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } .kpis { grid-template-columns: repeat(3, 1fr); } }
  @media (prefers-reduced-motion: reduce) { .live::before { animation: none; } }
</style>
</head>
<body>
<header>
  <h1><span>Egg Head</span> · run dashboard</h1>
  <div class="sub" id="title"></div>
  <span class="live" id="live">live</span>
  <div class="grow"></div>
  <a href="/">Meeting ↗</a>
  <button id="start">Start call</button>
</header>

<div class="kpis">
  <div class="kpi"><b id="k-lines">0</b><span>lines heard</span></div>
  <div class="kpi bad"><b id="k-wrong">0</b><span>wrong claims caught</span></div>
  <div class="kpi egg"><b id="k-spoke">0</b><span>times Egg Head spoke</span></div>
  <div class="kpi quiet"><b id="k-quiet">0</b><span>times it stayed quiet</span></div>
  <div class="kpi agent"><b id="k-llm">0</b><span>LLM calls</span></div>
</div>

<main>
  <section>
    <h2>Transcript</h2>
    <div id="transcript"><div class="empty">The call shows up here once it starts.</div></div>
  </section>
  <div class="right">
    <section>
      <h2>Claims checked</h2>
      <div id="checks"><div class="empty">None yet.</div></div>
    </section>
    <section>
      <h2>Agent tasks</h2>
      <div id="tasks"><div class="empty">None yet.</div></div>
    </section>
    <section>
      <h2>Questions</h2>
      <div id="questions"><div class="empty">None yet.</div></div>
    </section>
    <section>
      <h2>Why Egg Head stayed quiet</h2>
      <div id="quiet" class="quiet-list"><div class="empty">Nothing yet.</div></div>
    </section>
  </div>
</main>
<script type="module" src="/web/dashboard.js"></script>
</body>
</html>
