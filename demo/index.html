<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Egg Head · live call</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #232733; --text: #e6e8ee; --muted: #8b91a1;
    --accent: #f5c84c; --ok: #4cc38a; --bad: #ef6b6b; --info: #6aa8ff; --chip: #1f2430;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; }
  header h1 span { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 13px; }
  header button { margin-left: auto; background: var(--accent); color: #1a1500; border: 0; border-radius: 8px; padding: 8px 16px; font-weight: 650; cursor: pointer; }
  header button:disabled { opacity: .5; cursor: default; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; padding: 20px 24px; }
  #call { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .card.live { border-color: #3a4256; }
  .who { font-weight: 650; margin-right: 6px; }
  .heard { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { background: var(--chip); border-radius: 6px; padding: 2px 8px; font-size: 12.5px; color: var(--muted); }
  .chip b { color: var(--text); font-weight: 600; }
  .chip.claim b { color: var(--info); }
  .chip.contradicts { color: var(--bad); } .chip.supports { color: var(--ok); }
  .gate { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; font-size: 12px; }
  .gate span { padding: 1px 6px; border-radius: 5px; background: var(--chip); color: var(--muted); }
  .gate span.pass { color: var(--ok); } .gate span.fail { color: var(--bad); background: #2a1b1e; }
  .gate .label { background: none; padding-left: 0; color: var(--muted); }
  .egg { background: #2a2410; border: 1px solid #5a4a16; border-radius: 12px; padding: 12px 14px; }
  .egg .who { color: var(--accent); }
  .note { color: var(--muted); font-size: 12px; font-style: italic; margin-top: 4px; }
  aside { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 20px; align-self: start; }
  .stat { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .stat:last-child { border: 0; }
  .stat .v { font-variant-numeric: tabular-nums; font-weight: 650; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .ledger div { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .ledger div:last-child { border: 0; }
  .ledger .state { float: right; font-size: 12px; }
  .ledger .open { color: var(--accent); } .ledger .raised { color: var(--bad); } .ledger .closed { color: var(--ok); }
  .compare { font-size: 13px; color: var(--muted); }
  .compare b { color: var(--text); }
  .empty { color: var(--muted); font-size: 13px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { position: static; } }
</style>
</head>
<body>
<header>
  <h1><span>Egg Head</span> · <span id="title" style="color:var(--text)">incident call</span></h1>
  <div class="sub" id="mode"></div>
  <div class="sub" id="status"></div>
  <button id="start">Start call</button>
</header>
<main>
  <section id="call"><div class="empty">Press Start: the call plays with audio, and every decision Egg Head makes appears here.</div></section>
  <aside>
    <div class="card">
      <h2>This call</h2>
      <div class="stat"><span>Lines heard</span><span class="v" id="s-lines">0</span></div>
      <div class="stat"><span>Egg Head spoke</span><span class="v" id="s-spoke">0</span></div>
      <div class="stat"><span>Decider batches (p50)</span><span class="v" id="s-decider">0</span></div>
      <div class="stat"><span>Bedrock calls</span><span class="v" id="s-bedrock">0</span></div>
    </div>
    <div class="card compare" id="compare">
      <h2>vs an LLM on every line</h2>
      <div id="c-text" class="empty">Starts with the call.</div>
    </div>
    <div class="card ledger">
      <h2>Claims checked against live systems</h2>
      <div id="ledger"><div class="empty">None yet.</div></div>
    </div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id)
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
const pct = (p) => p === undefined || p === null ? "–" : p.toFixed(2)
const GATE = { persisted: "call moved on", not_repaired: "not corrected", min_silence: "silence ≥ 0.5 s", floor_open: "floor open", worth_it: "worth it", cooldown: "cooldown" }

let audioOn = false
let bedrock = false
const cards = new Map()   // line index -> { root, decision, gate }
const claims = new Map()  // turn -> { text, state }
let stats = { lines: 0 }

const play = (src) => { if (!audioOn) return; const a = new Audio(src); a.play().catch(() => {}) }

function card(i) {
  if (!cards.has(i)) {
    const root = el("div", "card")
    const decision = el("div", "chips"), gate = el("div", "gate")
    root.append(el("div", "", ""), el("div", "heard"), decision, gate, el("div", "note"))
    $("call").append(root)
    cards.set(i, { root, decision, gate })
  }
  return cards.get(i)
}

function renderLedger() {
  const box = $("ledger"); box.innerHTML = ""
  if (claims.size === 0) { box.append(el("div", "empty", "None yet.")); return }
  for (const c of claims.values()) {
    const label = { open: "flagged, waiting", raised: "raised by Egg Head", closed: "call corrected it", parked: "parked by the call", supports: "true" }[c.state]
    const cls = { supports: "closed", parked: "closed" }[c.state] ?? c.state
    box.append(el("div", "", `<span class="state ${cls}">${label}</span>${esc(c.text)}`))
  }
}

function onEvent(i, ev) {
  const c = card(i)
  const rt = ev.route
  if (ev.speaker !== "(silence)" && rt) {
    const chips = [`<span class="chip">Decider <b>${Math.round(ev.deciderMs)} ms</b></span>`,
      `<span class="chip claim">claim <b>${pct(rt.scores.claim)}</b></span>`]
    if (rt.action === "check" && rt.scores.bedrock !== undefined) chips.push(`<span class="chip">Decider could not route it; <b>Bedrock</b> picked <b>${esc(rt.check)}</b> on <b>${esc(rt.resource)}</b></span>`)
    else if (rt.action === "check") chips.push(`<span class="chip">check <b>${esc(rt.check)}</b> on <b>${esc(rt.resource)}</b> · res ${pct(rt.scores.resource)} · check ${pct(rt.scores.check)}</span>`)
    if (rt.action === "escalate") chips.push(`<span class="chip">${bedrock ? "a claim Decider could not route: escalated to Bedrock" : "a claim Decider could not route (no Bedrock in this run)"}</span>`)
    if (ev.verdict) chips.push(`<span class="chip ${ev.verdict}">${ev.verdict === "contradicts" ? "✗ contradicted" : ev.verdict === "supports" ? "✓ matches" : "inconclusive"}${ev.checkEvidence ? `: ${esc(ev.checkEvidence)}` : ""}</span>`)
    c.decision.innerHTML = chips.join("")
    if (ev.verdict === "contradicts") claims.set(ev.turn, { text: `${ev.speaker}: “${ev.text}”`, state: "open" })
    if (ev.verdict === "supports") claims.set(ev.turn, { text: `${ev.speaker}: “${ev.text}”`, state: "supports" })
  }
  if (ev.gate) {
    const g = ev.gate
    const parts = Object.entries(GATE).map(([k, label]) => `<span class="${g.reasons[k] ? "pass" : "fail"}">${g.reasons[k] ? "✓" : "✗"} ${label}</span>`)
    const extra = ev.gateScores && ev.gateScores.finished !== undefined ? ` <span>P(finished) ${pct(ev.gateScores.finished)}</span>` : ""
    c.gate.innerHTML = `<span class="label">gate ${g.speak ? "OPEN" : "closed"}:</span>${parts.join("")}${extra}`
    if (g.repairedBy) {
      for (const cl of claims.values()) if (cl.state === "open") cl.state = "closed"
      c.root.querySelector(".note").textContent = `Stays quiet: the call corrected it (${g.repairedBy}).`
    } else if (!g.speak && g.blockedBy === "worth_it") {
      for (const cl of claims.values()) if (cl.state === "open") cl.state = "parked"
      c.root.querySelector(".note").textContent = "Stays quiet: not worth interrupting (the topic was parked)."
    }
  }
  if (ev.said) for (const cl of claims.values()) if (cl.state === "open") { cl.state = "raised"; break }
  renderLedger()
}

function onMessage(m) {
  switch (m.type) {
    case "status": $("mode").dataset.status = m.text; $("status").textContent = m.text; break
    case "reset": cards.clear(); claims.clear(); $("call").innerHTML = ""; renderLedger(); break
    case "meta":
      $("title").textContent = m.title
      bedrock = m.writer === "bedrock"
      $("mode").textContent = `${m.mode === "transcribe" ? "Amazon Transcribe hears the call" : "transcript mode"} · writer: ${m.writer === "bedrock" ? "Bedrock (Strands agent)" : "template"}`
      if ($("call").querySelector(".empty")) $("call").innerHTML = ""
      break
    case "line": {
      document.querySelectorAll(".card.live").forEach((e) => e.classList.remove("live"))
      const c = card(m.index); c.root.classList.add("live")
      c.root.firstChild.innerHTML = `<span class="who">${esc(m.speaker)}</span>${esc(m.text)}`
      play(m.audio); c.root.scrollIntoView({ behavior: "smooth", block: "nearest" })
      break
    }
    case "heard": { const c = card(m.index); if (c.root.firstChild.textContent.indexOf(m.text) < 0) c.root.querySelector(".heard").textContent = `heard: “${m.text}”`; break }
    case "event": onEvent(m.index, m.event); break
    case "floor": {
      if (document.querySelector(".egg.pending")) break
      const e = el("div", "egg pending", `<span class="who">Egg Head</span><span class="note">taking the floor… ${bedrock ? "Bedrock is writing the line" : "writing the line"}</span>`)
      card(m.index).root.after(e); e.scrollIntoView({ behavior: "smooth", block: "nearest" })
      break
    }
    case "egghead": {
      const e = el("div", "egg", `<span class="who">Egg Head</span>${esc(m.text)}`)
      const pending = document.querySelector(".egg.pending")
      if (pending) pending.replaceWith(e); else card(m.index).root.after(e)
      play(m.audio); e.scrollIntoView({ behavior: "smooth", block: "nearest" })
      break
    }
    case "stats": {
      const s = m.stats; stats = s
      $("s-lines").textContent = s.lines; $("s-spoke").textContent = s.spoke
      $("s-decider").textContent = `${s.deciderBatches} (${s.deciderMsP50} ms)`; $("s-bedrock").textContent = s.bedrockCalls
      $("c-text").className = ""
      $("c-text").innerHTML = `An LLM reading every line makes <b>${s.lines} calls</b>, each about <b>1.2 s</b> (p95 3 s) for a 120B model with no reasoning (research/decider exp 11).<br><br>Egg Head made <b>${s.bedrockCalls}</b> Bedrock call${s.bedrockCalls === 1 ? "" : "s"}; Decider answered every line at <b>${s.deciderMsP50} ms</b> p50 per batch.`
      break
    }
    case "done": $("start").disabled = false; $("start").textContent = "Run again"; break
  }
}

$("start").onclick = () => { audioOn = true; $("start").disabled = true; fetch("/start", { method: "POST" }) }
// ?replay shows the last run without a live connection (screenshots, reviewing a run)
if (new URLSearchParams(location.search).has("replay")) fetch("/history").then((r) => r.json()).then((ms) => ms.forEach(onMessage))
else new EventSource("/events").onmessage = (e) => onMessage(JSON.parse(e.data))
</script>
</body>
</html>
